# Production stack.
#
# Start Mongo and Redis first:
#   docker compose -f docker-compose.mongo.yml up -d
#   docker compose -f docker-compose.redis.yml up -d
#
# Then:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  game:
    build:
      context: .
      target: production

    container_name: waste_syndicate_game

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://waste_syndicate_mongodb:27017/}
      REDIS_URL: ${REDIS_URL:-redis://waste_syndicate_redis:6379/0}

    volumes:
      - ./texts:/app/texts:ro
      - ./offset.json:/app/offset.json

    networks:
      - waste_syndicate_net

networks:
  waste_syndicate_net:
    external: true
    name: waste_syndicate_net